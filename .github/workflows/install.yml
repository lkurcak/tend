name: install
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  cargo:
    runs-on: ubuntu-latest

    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install
        run: |
          cargo install tend --verbose

      - name: Run
        run: |
          tend --version

  homebrew-macos:
    runs-on: macos-latest
    steps:
    - name: Install
      run: |
        brew install lkurcak/tap/tend

    - name: List installed packages
      run: |
        brew list

    - name: Run
      run: |
        tend --version

  homebrew-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Install Homebrew
      run: |
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH

    - name: Install
      run: |
        brew install lkurcak/tap/tend

    - name: List installed packages
      run: |
        brew list

    - name: Run
      run: |
        tend --version

  winget:
    runs-on: windows-latest
    steps:
    - name: Install
      run: |
        winget install lkurcak.tend --disable-interactivity --accept-source-agreements

    - name: List installed packages
      run: |
        winget list

    - name: Add winget links to path
      run: |
        Add-Content $env:GITHUB_PATH "$env:LOCALAPPDATA/Microsoft/WinGet/Links/"

    - name: Run
      run: |
        tend --version
